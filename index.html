<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LM音乐台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 背景层 -->
  <div class="bg-layer" id="bgLayer"></div>

  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <span class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </span>
      <span class="logo-text">LM音乐台</span>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-view="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>推荐</span>
      </button>
      <button class="nav-item" data-view="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>搜索</span>
      </button>
      <button class="nav-item" data-view="queue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>播放列表</span>
      </button>
      <button class="nav-item" data-view="top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        <span>排行榜</span>
      </button>
      <button class="nav-item" data-view="local">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><polyline points="12 17 12 9"/><polyline points="9 12 12 9 15 12"/></svg>
        <span>本地音乐</span>
      </button>
      <button class="nav-item" data-view="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>历史播放</span>
      </button>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item" id="btnOpenSettings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>设置</span>
      </button>
    </div>
  </aside>

  <!-- 主内容 -->
  <main class="main" id="main">
    <section class="view active" id="view-home">
      <div class="view-header"><h1 id="homeTitle">推荐</h1></div>
      <div class="section-title">推荐歌单</div>
      <div class="card-grid" id="recommendPlaylists"></div>
      <div class="section-title">热门歌曲</div>
      <div class="song-list" id="homeSongs"></div>
    </section>

    <section class="view" id="view-search">
      <div class="search-bar">
        <input id="searchInput" placeholder="输入歌曲名、歌手名搜索">
        <button class="btn primary" id="btnSearch">搜索</button>
      </div>
      <div class="song-list" id="searchResults"></div>
    </section>

    <section class="view" id="view-playlists">
      <div id="playlistView"></div>
    </section>

    <section class="view" id="view-queue">
      <div class="view-header toolbar">
        <h1>播放列表</h1>
        <div class="row">
          <button class="btn primary" id="btnPlayQueueAll">播放全部</button>
          <button class="btn" id="btnClearQueue">清空队列</button>
        </div>
      </div>
      <div class="song-list" id="queueList"></div>
    </section>

    <section class="view" id="view-history">
      <div class="view-header toolbar">
        <h1>历史播放</h1>
        <button class="btn" id="btnClearHistory">清空历史</button>
      </div>
      <div class="song-list" id="historyList"></div>
    </section>

    <section class="view" id="view-top">
      <div class="view-header"><h1>排行榜</h1></div>
      <div class="card-grid" id="topList"></div>
    </section>

    <section class="view" id="view-local">
      <div class="view-header toolbar">
        <h1>本地音乐</h1>
        <div class="row">
          <label class="btn primary file-btn">上传音乐<input type="file" id="localFileInput" accept="audio/*" multiple hidden></label>
          <button class="btn" id="btnClearLocal">清空全部</button>
        </div>
      </div>
      <p class="hint">支持 MP3 / FLAC 等格式，自动读取标签（封面、歌词、歌手、专辑），文件保存在本浏览器中。</p>
      <div class="song-list" id="localList"></div>
    </section>
  </main>

  <!-- 歌词面板 -->
  <aside class="lyric-panel hidden" id="lyricPanel">
    <div class="lyric-header">
      <span>歌词</span>
      <button class="icon-btn" id="btnLyricClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="lyric-scroll" id="lyricScroll"></div>
  </aside>

  <!-- 播放器控制栏 -->
  <footer class="player-bar style-blur" id="playerBar">
    <div class="player-left">
      <div class="cover-wrap">
        <img id="coverImg" src="" alt="封面">
      </div>
      <div class="song-meta">
        <div class="song-name" id="songName">未在播放</div>
        <div class="song-artist" id="songArtist">暂无歌曲</div>
      </div>
      <button class="icon-btn" id="btnDownload" title="下载">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
    </div>

    <div class="player-center">
      <div class="controls">
        <button class="icon-btn" id="btnMode" title="播放模式">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
        <button class="icon-btn" id="btnPrev" title="上一首">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20" fill="currentColor" stroke="none"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
        </button>
        <button class="play-btn" id="btnPlay" title="播放">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="icon-btn" id="btnNext" title="下一首">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor" stroke="none"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
        <button class="icon-btn" id="btnLyricToggle" title="歌词">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        </button>
      </div>
      <div class="progress-row">
        <span class="time" id="curTime">00:00</span>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
        <span class="time" id="durTime">00:00</span>
      </div>
    </div>

    <div class="player-right">
      <button class="quality-tag" id="qualityTag" title="点击切换音质">极高</button>
      <div class="volume-wrap">
        <button class="icon-btn" id="btnVolume" title="音量">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
      </div>
    </div>
  </footer>

  <audio id="audioPlayer"></audio>

  <!-- 设置模态框 -->
  <div class="modal-overlay hidden" id="settingsOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>设置</h2>
        <button class="icon-btn" data-close>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="setting-group">
          <h3>音频</h3>
          <label class="field-label">音频质量（由 config.json 中的 api.audioLevel 控制默认值）</label>
          <select id="setAudioLevel">
            <option value="standard">标准</option>
            <option value="higher">较高</option>
            <option value="exhigh">极高</option>
            <option value="lossless">无损</option>
            <option value="hires">Hi-Res</option>
          </select>
          <p class="hint">API 地址由管理员在 config.json 中配置，此处不提供修改。</p>
        </div>

        <div class="setting-group">
          <h3>外观</h3>
          <label class="field-label">背景图片 URL（留空为纯白背景）</label>
          <input type="text" id="setBgUrl" placeholder="https://example.com/bg.jpg">
          <div class="row">
            <label class="btn file-btn">上传图片<input type="file" id="setBgFile" accept="image/*" hidden></label>
            <button class="btn" id="btnClearBg">清除背景</button>
          </div>
          <label class="field-label">主题色</label>
          <div class="color-row">
            <input type="color" id="setPrimaryColor" value="#ffffff">
            <div class="swatches" id="colorSwatches">
              <span data-color="#ffffff" class="active"></span>
              <span data-color="#1e90ff"></span>
              <span data-color="#ff4d6d"></span>
              <span data-color="#22c55e"></span>
              <span data-color="#a855f7"></span>
              <span data-color="#f59e0b"></span>
              <span data-color="#0ea5e9"></span>
              <span data-color="#111111"></span>
            </div>
          </div>
          <label class="field-label">控制栏样式</label>
          <div class="style-options" id="styleOptions">
            <label class="style-card" data-style="blur">
              <span class="style-demo demo-blur"></span>
              <span class="style-name">模糊</span>
              <input type="radio" name="ctlstyle" value="blur" hidden>
            </label>
            <label class="style-card" data-style="glass">
              <span class="style-demo demo-glass"></span>
              <span class="style-name">毛玻璃</span>
              <input type="radio" name="ctlstyle" value="glass" hidden>
            </label>
            <label class="style-card" data-style="liquid">
              <span class="style-demo demo-liquid"></span>
              <span class="style-name">液态玻璃</span>
              <input type="radio" name="ctlstyle" value="liquid" hidden>
            </label>
          </div>
        </div>

        <div class="setting-group">
          <h3>配置</h3>
          <div class="row">
            <button class="btn" id="btnExportConfig">导出配置</button>
            <button class="btn" id="btnImportConfig">导入配置</button>
            <button class="btn danger" id="btnResetConfig">恢复默认</button>
          </div>
          <input type="file" id="importConfigFile" accept="application/json" hidden>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>取消</button>
        <button class="btn primary" id="btnSaveSettings">保存设置</button>
      </div>
    </div>
  </div>

  <!-- 音质选择模态框 -->
  <div class="modal-overlay hidden" id="qualityOverlay">
    <div class="modal small">
      <div class="modal-header">
        <h2>音频质量</h2>
        <button class="icon-btn" data-close>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="quality-list" id="qualityList">
          <button class="quality-item" data-level="standard">标准</button>
          <button class="quality-item" data-level="higher">较高</button>
          <button class="quality-item" data-level="exhigh">极高</button>
          <button class="quality-item" data-level="lossless">无损</button>
          <button class="quality-item" data-level="hires">Hi-Res</button>
        </div>
      </div>
    </div>
  </div>

    <!-- 下载选项模态框 -->
  <div class="modal-overlay hidden" id="downloadOverlay">
    <div class="modal small">
      <div class="modal-header">
        <h2>下载</h2>
        <button class="icon-btn" data-close>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="download-song" id="downloadSongName"></div>
        <div class="download-options">
          <button class="btn primary" id="btnDlAudio">只下载音频 (MP3)</button>
          <button class="btn" id="btnDlCover">只下载歌曲图片</button>
          <button class="btn" id="btnDlLyric">只下载歌词 (LRC)</button>
          <button class="btn" id="btnDlPack">下载带标签音频（内嵌封面+歌词）</button>
        </div>
        <p class="hint">带标签音频：将封面图片和歌词直接写入 MP3 文件的 ID3 标签（APIC/USLT），单个文件即可在播放器中显示封面和歌词。</p>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/local.js"></script>
  <script src="js/player.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
